buildscript {
    ext {
     springBootVersion = '4.1.1'
    }
    repositories {
        mavenLocal()
        maven { url "https://repo1.maven.org/maven2/" }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:$springBootVersion")
        classpath("org.asciidoctor:asciidoctor-gradle-plugin:1.5.7")
        // classpath("io.github.swagger2markup:swagger2markup-gradle-plugin:1.3.3")
        classpath("org.sonarsource.scanner.gradle:sonarqube-gradle-plugin:2.7.1")
    }
}


allprojects{
    version = project.getProperty('buildNumber')

    apply plugin: 'java'
    apply plugin: 'eclipse'
    apply plugin: 'idea'
    apply plugin: "org.sonarqube"
    apply plugin: "jacoco"


    group = 'com.vmware'
    sourceCompatibility = '17'


    repositories {
        mavenLocal() 
        maven { url "https://repo1.maven.org/maven2/" }
        mavenCentral()
    }
}

subprojects{

    // Jackson 3 (tools.jackson), managed by the Spring Boot BOM; 3.1.7 fixes CVE-2026-91777
    ext['jackson-bom.version'] = '3.1.7'
    // OpenTelemetry (via google-cloud-storage), managed by the Spring Boot BOM; 1.67.0 fixes CVE-2026-118259
    ext['opentelemetry.version'] = '1.67.0'
    // Jackson 2 and Tomcat are pinned by the Spring Boot BOM below the patched releases.
    ext['jackson-2-bom.version'] = '2.21.7' // CVE-2026-89425, CVE-2026-89407, CVE-2026-91777, CVE-2026-91776
    ext['tomcat.version'] = '11.0.26' // CVE-2026-65905, CVE-2026-65637, CVE-2026-65182, CVE-2026-68525
    ext['postgresql.version'] = '42.7.14' // CVE-2024-1597, CVE-2022-26520, CVE-2020-13692, CVE-2022-31197, CVE-2022-21724

    ext {
        projectVersion = '0.0.1-SNAPSHOT'
        httpclient='4.5.14'
        jacksonVersion = '2.21.7'
        jacksonAnnotationVersion = '2.21'
        springdocVersion='3.1.1'
        tomcatVersion= '11.0.26'

    	ehCacheVersion = '3.12.0'
    	cacheApiVersion='1.1.1'
    	hsqlVersion = '2.3.3'
    	junitVersion = '4.13.2'
    	jsonSimpleVersion = '1.1.1'
    	commonsCollectionsVersion = '3.2.2'
    	commonsLangVersion = '3.20.0'
    	commonsIoVersion = '2.22.0'
    	commonsCodecVersion='1.22.0'

    	guavaVersion="33.7.2-jre"
    	snakeyam="2.6"
    	jjwtVersion="0.9.1"
    	jakartaPersistenceVersion = "3.2.0"
    	log4j2Version="2.26.1"
    	slf4jVersion="2.0.18"
		nimbusJoseJwtVersion="10.1"

    	postgresqlVersion = "42.7.14" // CVE-2024-1597, CVE-2022-26520, CVE-2020-13692, CVE-2022-31197, CVE-2022-21724
        jgitVersion = "5.13.5.202508271544-r" // CVE-2023-4759, CVE-2025-4949
        fastjsonVersion = "2.0.66" // CVE-2022-25845; fastjson 1.2.x has no fix for CVE-2026-16723
        quartzVersion = "2.5.2" // CVE-2019-13990
        jythonVersion = "2.7.4" // CVE-2013-2027
        commonsFileUploadVersion = "1.6.0" // CVE-2025-48976
    	druidVersion = "1.1.8"
    	awsS3Version = "1.12.797"
        gcpGcsVersion = "26.88.0"
        grpcVersion = "1.76.0"
        swaggerVersion = "3.0.0"
        icu4jVersion = "77.1"
		jodaTimeVersion = "2.13.1"

    	buildRelease = 'beta'
    	remoteServer = ""
    	deployPath="$rootDir/../publish/"
    }

   tasks.withType(JavaCompile) {
       options.encoding = "UTF-8"
    }

    // CVE-2025-68161: force log4j2 >= 2.25.3 via Spring dependency-management plugin BOM override
    plugins.withId('io.spring.dependency-management') {
        dependencyManagement {
            dependencies {
                dependencySet(group: 'org.apache.logging.log4j', version: "$log4j2Version") {
                    entry 'log4j-api'
                    entry 'log4j-core'
                    entry 'log4j-slf4j2-impl'
                    entry 'log4j-jul'
                    entry 'log4j-web'
                    entry 'log4j-layout-template-json'
                }
                dependency "org.slf4j:slf4j-api:$slf4jVersion"
            }
        }
    }

    // Force patched versions when a BOM or transitive dependency still requests a vulnerable release.
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            def g = details.requested.group
            def n = details.requested.name
            def v = details.requested.version
            if (g == 'com.google.guava' && n == 'guava') {
                details.useVersion guavaVersion
                details.because 'CVE-2026-102554'
            } else if (g == 'com.fasterxml.jackson.core' && (n == 'jackson-core' || n == 'jackson-databind') && v != jacksonVersion) {
                details.useVersion jacksonVersion
                details.because 'CVE-2026-89425, CVE-2026-89407, CVE-2026-91777, CVE-2026-83557, CVE-2026-68497, CVE-2026-19032, CVE-2026-91776'
            } else if ((g == 'com.fasterxml.jackson.dataformat' || g == 'com.fasterxml.jackson.datatype' || g == 'com.fasterxml.jackson.module') && v != jacksonVersion) {
                details.useVersion jacksonVersion
                details.because 'CVE-2026-91777, CVE-2026-91776'
            } else if (g == 'commons-io' && n == 'commons-io' && v != commonsIoVersion) {
                details.useVersion commonsIoVersion
                details.because 'CVE-2024-47554, CVE-2021-29425'
            } else if (g == 'org.apache.httpcomponents' && n == 'httpclient' && v != httpclient) {
                details.useVersion httpclient
                details.because 'CVE-2020-13956'
            } else if ((g == 'org.apache.tomcat' || g == 'org.apache.tomcat.embed') && v != null && v.startsWith('11.') && v != tomcatVersion) {
                details.useVersion tomcatVersion
                details.because 'CVE-2026-65905, CVE-2026-65637, CVE-2026-65182, CVE-2026-68525'
            } else if (g == 'org.postgresql' && n == 'postgresql' && v != postgresqlVersion) {
                details.useVersion postgresqlVersion
                details.because 'CVE-2024-1597, CVE-2022-26520, CVE-2020-13692, CVE-2022-31197, CVE-2022-21724'
            } else if (g == 'com.alibaba' && n == 'fastjson' && v != null && v.startsWith('1.')) {
                details.useVersion fastjsonVersion
                details.because 'CVE-2022-25845, CVE-2026-16723'
            } else if (g == 'org.eclipse.jgit' && v != jgitVersion) {
                details.useVersion jgitVersion
                details.because 'CVE-2023-4759, CVE-2025-4949'
            } else if (g == 'org.quartz-scheduler' && (n == 'quartz' || n == 'quartz-jobs') && v != quartzVersion) {
                details.useVersion quartzVersion
                details.because 'CVE-2019-13990'
            } else if (g == 'org.python' && n == 'jython-standalone' && v != jythonVersion) {
                details.useVersion jythonVersion
                details.because 'CVE-2013-2027'
            } else if (g == 'commons-fileupload' && n == 'commons-fileupload' && v != commonsFileUploadVersion) {
                details.useVersion commonsFileUploadVersion
                details.because 'CVE-2025-48976'
            }
        }
    }
}
