apply plugin: 'java'

description = 'VIP i18n pattern CLDR data extract tools'

ext {
    javaLevel = 1.8
    cldrVersion = '32.0.0'
    projectVersion = '0.10.38'
    deployPath="$rootDir/../publish/"
    sourceCompatibility = javaLevel
    version = '1.0'
}

configurations {
    jar
}

jar {
    archiveBaseName = "i18n-patterns-core"
    archiveVersion = "$projectVersion"
    archiveClassifier = ''
    exclude('**/cldr/data/*')
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation group: 'commons-collections', name: 'commons-collections', version: '3.2.2'
    implementation('com.googlecode.json-simple:json-simple:1.1.1'){
          exclude group: 'junit'
    }
    // 2.12.6.1 is affected by CVE-2022-42003, CVE-2022-42004, CVE-2026-91777, CVE-2026-91776 and others
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.21.7'
    // 2.4 is affected by CVE-2021-29425 and CVE-2024-47554
    implementation group: 'commons-io', name: 'commons-io', version: '2.22.0'
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '1.7.36'
    // log4j 1.2.17 is EOL (CVE-2019-17571, CVE-2021-4104, CVE-2022-23302, CVE-2022-23305, CVE-2022-23307, CVE-2023-26464)
    runtimeOnly group: 'org.slf4j', name: 'slf4j-simple', version: '1.7.36'
	  testImplementation group: 'junit', name: 'junit', version: '4.13.2'

}

test {
    systemProperties 'property': 'value'
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

task copyLibs(type :Copy, dependsOn: jar) {
    from "$buildDir/libs"
    into "$rootDir/../../../publish/"
    println "The build was output to -> $rootDir/../../../publish/"
    include "**/*.jar"
}

task copyResources(type: Copy) {
	File dir = new File("${buildDir}/classes/main");
	dir.deleteDir();
    from "${projectDir}/src/main/resources"
    into "${buildDir}/classes/main"
}
processTestResources.dependsOn copyResources

task download(type: JavaExec, dependsOn: classes){
	mainClass = 'com.vmware.i18n.PatternParseMain'
	classpath sourceSets.main.runtimeClasspath
}

task sourcesJar(type: Jar, dependsOn: classes) {
    archiveBaseName = "i18n-patterns-core"
    archiveVersion = "$projectVersion"
    archiveClassifier = 'sources'
    from sourceSets.main.allJava
}
 
task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveBaseName = "i18n-patterns-core"
    archiveVersion = "$projectVersion"
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}
 
tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('encoding', 'UTF-8')
    options.addStringOption('charSet', 'UTF-8')
}
 
artifacts {
    archives sourcesJar
    archives javadocJar
}
assemble.dependsOn.add download
assemble.dependsOn.add copyLibs
