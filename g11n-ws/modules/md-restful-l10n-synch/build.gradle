apply plugin: 'java-library'
apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'

archivesBaseName = 'md-restful-l10n-synch'

configurations {
	bootJar
    war
    providedRuntime
   // remove default logger
   all*.exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
}

dependencies {
    implementation project(":vip-common")
    implementation project(":md-restful-api")
    compileOnly("org.springframework.boot:spring-boot-starter-web")
    compileOnly ('org.springframework.boot:spring-boot-starter-log4j2')
    api("org.eclipse.jgit:org.eclipse.jgit:$jgitVersion")
    api("org.eclipse.jgit:org.eclipse.jgit.ssh.jsch:$jgitVersion")
}

bootJar {
  enabled = false
}
jar {
    archiveClassifier = ''
	enabled = true
}
