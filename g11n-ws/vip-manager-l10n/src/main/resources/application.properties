# enable default configuration
spring.profiles.active=bundle
# keep Jackson 2 as the JSON mapper for HTTP message conversion (spring-boot-jackson2 bridge)
spring.http.converters.preferred-json-mapper=jackson2


#actuator
management.endpoints.web.base-path=/actuator
management.endpoints.jmx.exposure.exclude=*
management.endpoints.web.exposure.include=info, health

# enable default config
spring.profiles.remote.config.enable=false
#the singleton service config repo in gitlab
spring.profiles.remote.config.git.uri=####
spring.profiles.remote.config.git.branch=main
spring.profiles.remote.config.git.basedir=dev/l10n